# Grape - pull request checks
#
# Until this existed, nothing compiled or tested Grape on a pull request. The
# release workflow only runs on main and only builds once release-please has
# already cut a tag, so a change that broke the build or the tests was found at
# release time, on the branch users install from. Sixteen security advisories
# also accumulated unnoticed for the same reason: no job was looking.
#
# What is deliberately NOT gated here yet: `cargo clippy` and `cargo fmt
# --check`. Both fail on the current tree for reasons that predate this file --
# clippy.toml used to contain three keys that were lint names rather than
# configuration options, so clippy refused the whole file and never ran, which
# left a large pedantic/nursery backlog; and rustfmt.toml asks for edition 2024
# with nightly-only options while the crate is edition 2021, so the repository
# does not satisfy its own formatter under either toolchain. Turning either into
# a gate today would block every pull request on work unrelated to it. Fix the
# backlog, then add the gate.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, for the advisories job only: an advisory published against a
  # crate already on main turns it red without waiting for the next pull
  # request. The other jobs skip scheduled runs.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  # The event is in the group so the weekly run never cancels a push run on
  # main.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-${{ matrix.os }}

      # Same list as the release workflow: alsa-sys is the only crate needing a
      # system development package, and it resolves libasound through
      # pkg-config.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      # Windows and macOS were compile-verified only at release time, which is
      # the worst moment to discover a cfg mistake: the Linux tray backend and
      # the two tray-icon platforms are selected by cfg, so a mistake there is
      # invisible on the developer's machine.
      - name: Build
        run: cargo build --all-targets

      # Same check as the release workflow's Windows leg: SignPath signs only
      # an .exe whose version resource names the project and carries its
      # version, and build.rs is what writes it. Checked here so a pull
      # request that breaks it fails now rather than at the next release.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'grape' | ForEach-Object version
          $info = (Get-Item target\debug\grape.exe).VersionInfo
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'Grape' -or $info.ProductVersion -cne $version) {
            "::error::grape.exe has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Grape' and '$version'"
            exit 1
          }

      - name: Test
        run: cargo test
        # 20 of the player tests need a real audio device and are #[ignore]d, so
        # this proves the suite compiles and the rest passes -- not that audio
        # works on a runner with no sound card.

  msrv:
    name: minimum supported Rust
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cargo.toml promises rust-version = 1.90. design/dependencies.md: an
      # untested floor is a guess, so the promise belongs in CI.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: "1.90"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build at the declared floor
        run: cargo build

  # Dependabot raises alerts only for advisories that carry a GHSA alias, so a
  # RustSec-only advisory (lru RUSTSEC-2026-0253 has none) never reaches the
  # Security tab. cargo-audit reads the RustSec database directly, against the
  # committed Cargo.lock, which is the union over every target.
  #
  # It gates on warnings too (--deny warnings: unsound, unmaintained and yanked
  # crates, not only vulnerabilities), so red means something new. An advisory
  # nothing in this repository can fix is ignored by ID below, with the reason
  # and the upstream bump that lifts it, and is written up in
  # docs/internals/dependency-exceptions.md. Never turn the job off instead.
  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The prebuilt RustSec binary, checked against a pinned SHA-256, rather
      # than several minutes of cargo install.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit

      - name: cargo audit
        run: |
          ignore=(
            # lru 0.16.4, unsound (use-after-free if LruCache::pop panics),
            # fixed in 0.18.2. Pinned by cryoglyph 0.1.0 under iced_wgpu 0.14.
            # Lifted by an iced release whose cryoglyph takes lru >= 0.18.2.
            RUSTSEC-2026-0253
            # ttf-parser 0.25.1, unmaintained, no patched release. Used by
            # fontdb (cosmic-text, under iced) and ab_glyph (sctk-adwaita,
            # under winit). Lifted when both move to another font parser.
            RUSTSEC-2026-0192
            # paste 1.0.15, unmaintained, a compile-time macro only. Used by
            # lofty, metal (wgpu-hal), pulp (exr) and rav1e (ravif). Lifted
            # when all four drop it.
            RUSTSEC-2024-0436
          )
          cargo audit --deny warnings "${ignore[@]/#/--ignore=}"

  manifest:
    name: colony.json
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # colony.json shipped an invalid category for three releases because
      # nothing ever checked it. The schema catches that in seconds.
      - name: Validate against the published schema
        run: |
          python3 - <<'PY'
          import json, urllib.request
          schema = json.load(urllib.request.urlopen(
              "https://raw.githubusercontent.com/Project-Colony/"
              "Project-Colony-Resources/main/generated/colony.schema.json"))
          manifest = json.load(open("colony.json"))
          for key in schema.get("required", []):
              assert key in manifest, f"colony.json is missing the required key {key!r}"
          category = schema["properties"]["category"].get("enum")
          if category:
              assert manifest["category"] in category, (
                  f"category {manifest['category']!r} is not one of {category}")
          icon = manifest.get("icon")
          if icon:
              import os
              assert os.path.exists(icon), f"colony.json points at a missing icon: {icon}"
          print("colony.json is valid")
          PY
